<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Forest Green Gradients -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="45%" stop-color="#0D5C3A" />
      <stop offset="100%" stop-color="#062D1B" />
    </linearGradient>

    <linearGradient id="forestGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#0B4619" />
    </linearGradient>

    <!-- Vibrant Yellow Gradients -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FFEB3B" />
      <stop offset="70%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="yellowGradBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="forestSunburst" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#0D5C3A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#051E12" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="190" r="180" fill="url(#forestSunburst)" />

  <!-- Outer Ring with Decorative Beads in Yellow -->
  <circle cx="250" cy="190" r="155" fill="none" stroke="url(#yellowGrad)" stroke-width="2" stroke-dasharray="4,6" opacity="0.8" />
  <circle cx="250" cy="190" r="165" fill="none" stroke="url(#yellowGrad)" stroke-width="1.5" opacity="0.5" />

  <!-- Fireworks Rays radiating from center in Yellow -->
  <g stroke="url(#yellowGrad)" stroke-width="1.5" opacity="0.8" stroke-linecap="round">
    <line x1="250" y1="30" x2="250" y2="65" />
    <line x1="140" y1="70" x2="165" y2="95" />
    <line x1="360" y1="70" x2="335" y2="95" />
    <line x1="85" y1="175" x2="120" y2="180" />
    <line x1="415" y1="175" x2="380" y2="180" />
    <line x1="110" y1="280" x2="140" y2="260" />
    <line x1="390" y1="280" x2="360" y2="260" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#FACC15" filter="url(#glow)">
    <polygon points="250,20 253,30 263,33 253,36 250,46 247,36 237,33 247,30" />
    <polygon points="120,55 122,63 130,65 122,67 120,75 118,67 110,65 118,63" />
    <polygon points="380,55 382,63 390,65 382,67 380,75 378,67 370,65 378,63" />
    <polygon points="70,180 72,186 78,188 72,190 70,196 68,190 62,188 68,186" />
    <polygon points="430,180 432,186 438,188 432,190 430,196 428,190 422,188 428,186" />
  </g>

  <!-- Central Emblem: Roaring Lion Crest (Sri Angalaparameswari Thunai) -->
  <g filter="url(#glow)">
    <!-- Outer Shield / Circle with Forest Green & Yellow Border -->
    <circle cx="250" cy="180" r="105" fill="url(#forestGrad)" stroke="url(#yellowGradBright)" stroke-width="4" />
    <circle cx="250" cy="180" r="95" fill="#FFFFFF" stroke="url(#yellowGrad)" stroke-width="2" />

    <!-- Lion Head Silhouette Artwork (from Shop Banner) -->
    <g fill="#0D5C3A">
      <path d="M 220,120 C 235,112 265,112 280,125 C 295,138 305,160 300,185 C 295,205 275,222 250,225 C 230,227 210,218 198,202 C 188,188 188,168 195,152 C 190,145 185,135 192,128 C 200,120 210,125 218,122 Z" opacity="0.12"/>
      <path d="M 215,130 C 230,120 258,118 275,130 C 290,142 298,160 292,180 C 285,198 268,212 248,215 C 232,217 218,210 208,198 C 200,188 198,172 202,158 C 205,146 210,138 215,130 Z" fill="url(#forestGrad)"/>
      <path d="M 240,140 C 255,135 270,142 278,155 C 285,168 280,185 270,195 C 260,202 248,205 238,202 C 248,195 258,185 260,172 C 262,160 252,148 240,140 Z" fill="#FACC15"/>
      <circle cx="238" cy="155" r="4" fill="#073822" />
      <polygon points="275,170 290,165 285,175" fill="#FACC15" />
    </g>

    <!-- Top Arch Text: ஸ்ரீ அங்காளபரமேஸ்வரி துணை -->
    <path id="invocation-arc" d="M 160,135 A 105,105 0 0,1 340,135" fill="none" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#0D5C3A" letter-spacing="1">
      <textPath href="#invocation-arc" startOffset="50%" text-anchor="middle">
        ஸ்ரீ அங்காளபரமேஸ்வரி துணை
      </textPath>
    </text>

    <!-- Bottom Emblem Ribbon: நேரடி விற்பனை -->
    <rect x="180" y="235" width="140" height="22" rx="11" fill="url(#yellowGradBright)" stroke="#0D5C3A" stroke-width="1.5" />
    <text x="250" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#073822" letter-spacing="1">
      சிவகாசி நேரடி விற்பனை
    </text>
  </g>

  <!-- Circular Arch Text Banner -->
  <g id="brand-text">
    <!-- SRI NATCHIYAR Main Heading -->
    <text x="250" y="360"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="16"
          font-weight="900"
          letter-spacing="2"
          fill="#0D5C3A">
      ஸ்ரீ நாச்சியார் பட்டாசு கடை
    </text>

    <text x="250" y="405"
          text-anchor="middle"
          font-family="'Cinzel', 'Georgia', 'Plus Jakarta Sans', serif"
          font-size="40"
          font-weight="900"
          letter-spacing="4"
          fill="url(#yellowGradBright)"
          stroke="#073822"
          stroke-width="1.5"
          filter="url(#glow)">
      SRI NATCHIYAR
    </text>

    <text x="250" y="432"
          text-anchor="middle"
          font-family="'Cinzel', 'Georgia', 'Plus Jakarta Sans', serif"
          font-size="22"
          font-weight="900"
          letter-spacing="7"
          fill="#FEF08A">
      CRACKERS
    </text>

    <!-- Subtitle Line in Yellow & Forest Green -->
    <line x1="75" y1="445" x2="190" y2="445" stroke="url(#yellowGrad)" stroke-width="2" />
    <circle cx="195" cy="445" r="3.5" fill="#FACC15" />
    <polygon points="250,441 254,445 250,449 246,445" fill="#15803D" />
    <circle cx="305" cy="445" r="3.5" fill="#FACC15" />
    <line x1="310" y1="445" x2="425" y2="445" stroke="url(#yellowGrad)" stroke-width="2" />

    <text x="250" y="465"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="13"
          font-weight="800"
          letter-spacing="4"
          fill="#15803D">
      SIVAKASI FACTORY DIRECT SALES
    </text>

    <text x="250" y="485"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="3"
          fill="#CA8A04">
      📞 99941 00905 • 94427 01264 • 93637 79531
    </text>
  </g>
</svg>